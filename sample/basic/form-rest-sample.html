<!doctype html>

<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<title>FORM-REST sample</title>
<style type="text/css">
input {
	font-size: 9pt;
}
textarea {
	font-size: 9pt;
}
div#list table {
	border: 1px solid black;
	border-collapse: collapse;
}
div#list table th {
	border: 1px solid black;
	font-size: 9pt;

}
div#list table td {
	border: 1px solid black;
	font-size: 9pt;
}
</style>
<script type="text/javascript" src="jquery-4.0.0.min.js"></script>
<script type="text/javascript" src="memo-table.js"></script>
<script type="text/javascript">
$.ajaxSetup({ cache: false });

function show() {
	var request = $.getJSON('rest/memo.json', renderMemoTable);
}

function addRow() {
	$.post('rest/memo.json', {title: $('#title').val(), text: $('#text').val()}, show);
}

function updateRow(id) {
	$.post('rest/memo/'+id+'.json?_method=put', {title: $('#title' + id).val(), text: $('#text' + id).val()}, show);
}

function deleteRow(id) {
	$.post('rest/memo/'+id+'.json?_method=delete', {title: $('#title' + id).val(), text: $('#text' + id).val()}, show);
}
</script>
</head>

<body onload="show()">
<h1>FORM-REST sample</h1>
<hr />
<h2>Memo Service</h2>
<div id="list"></div>
<a href="rest/memo.print.json">ダウンロード</a>
</body>
</html>
