<!doctype html>

<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<title>JSON-REST sample</title>
<style type="text/css">
input {
	font-size: 9pt;
}
textarea {
	font-size: 9pt;
}
div#list table {
	border: 1px solid black;
	border-collapse: collapse;
}
div#list table th {
	border: 1px solid black;
	font-size: 9pt;

}
div#list table td {
	border: 1px solid black;
	font-size: 9pt;
}
</style>
<script type="text/javascript" src="jquery-4.0.0.min.js"></script>
<script type="text/javascript" src="memo-table.js"></script>
<script type="text/javascript">
function show() {
	var request = $.ajax({
		url: 'rest/memo.json',
		method: 'get',
		dataType: 'json',
		cache: false,
		success: renderMemoTable
	});
}

function addRow() {
	var request = $.ajax({
		url: 'rest/memo.json',
		method: 'post',
		contentType: 'application/json',
		data: JSON.stringify({title: $('#title').val(), text: $('#text').val()}),
		dataType: 'text',
		success: show
	});
}

function updateRow(id) {
	var request = $.ajax({
		url: 'rest/memo/'+id+'.json?_method=put',
		method: 'post',
		contentType: 'application/json',
		data: JSON.stringify({title: $('#title' + id).val(), text: $('#text' + id).val()}),
		dataType: 'text',
		success: show
	});
}

function deleteRow(id) {
	var request = $.ajax({
		url: 'rest/memo/'+id+'.json?_method=delete',
		method: 'post',
		contentType: 'application/json',
		dataType: 'text',
		success: show
	});
}
</script>
</head>

<body onload="show()">
<h1>JSON-REST sample</h1>
<hr />
<h2>Memo Service</h2>
<div id="list"></div>
<a href="rest/memo.print.json">ダウンロード</a>
</body>
</html>
